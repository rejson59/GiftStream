<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftStream — nakładka</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');:root{--lime:#c3f53c;--bg:#10110f;--text:#f3f3ee;--muted:#969b8e;--panel:#111813}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:var(--text);font-family:Manrope,sans-serif}.wrap{padding:12px}.card{border:1px solid #c3f53c66;background:#101511e8;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px #0005}.heading{padding:13px 14px 11px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff16}.brand{font-size:11px;font-weight:800;letter-spacing:.4px}.brand b{color:var(--lime)}.tag{color:var(--lime);font:8px 'DM Mono',monospace;letter-spacing:1px}.tag i{display:inline-block;width:5px;height:5px;background:var(--lime);border-radius:50%;margin-right:5px;vertical-align:middle}.preset{font:8px 'DM Mono',monospace;color:var(--muted);padding:10px 14px 3px}.rules{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.rule{min-height:55px;border:1px solid #ffffff14;background:#ffffff06;border-radius:6px;padding:7px;display:grid;grid-template-columns:27px 1fr;gap:6px;align-items:center}.gift{width:27px;height:27px;background:#c3f53c14;border-radius:5px;display:grid;place-items:center;font-size:14px}.rule b{display:block;font-size:8px;line-height:1.3}.rule small{display:block;color:var(--muted);font-size:7px;margin-top:3px}.foot{padding:8px 13px;border-top:1px solid #ffffff13;color:#858a7e;font:7px 'DM Mono',monospace;display:flex;justify-content:space-between}.recent{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:grid;gap:7px}.alert{background:#111810ee;border:1px solid var(--lime);border-radius:7px;padding:9px 14px;box-shadow:0 0 22px #c3f53c25;font-size:11px;font-weight:700;white-space:nowrap;animation:pop .25s ease-out,fade 5s forwards}.alert i{font-style:normal;margin-right:6px}.list .rules{grid-template-columns:1fr}.list .rule{min-height:43px}.list .card{max-width:300px}.minimal .card{display:none}.minimal .recent{top:auto;bottom:14px;left:14px;transform:none}@keyframes pop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{0%,75%{opacity:1}100%{opacity:0}}
.card{border-radius:14px;border-color:#c8f36a70;background:linear-gradient(145deg,#111813f2,#0d120fee);box-shadow:0 14px 44px #0007;backdrop-filter:blur(16px)}.heading{padding:14px 15px 12px}.rule{min-height:58px;border-radius:10px;background:linear-gradient(145deg,#ffffff0b,#ffffff04);transition:transform .2s ease,border-color .2s ease}.gift{border-radius:8px;background:linear-gradient(145deg,#c8f36a20,#c8f36a08);overflow:hidden}.rule b{font-size:9px}.rule small{font-size:8px}.tag{font-size:9px}.foot{font-size:8px}.alert{border-radius:11px;background:#101810f2;backdrop-filter:blur(12px);box-shadow:0 8px 28px #0007,0 0 24px #c8f36a20}.minimal .alert{font-size:12px}@media(max-width:360px){.rules{grid-template-columns:1fr}.wrap{padding:8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><div class="wrap"><div class="card"><div class="heading"><span class="brand">GIFTSTREAM <b>×</b> ZASADY GRY</span><span class="tag"><i></i> NA ŻYWO</span></div><div class="preset" id="preset">AKTYWNY PRESET · ŁADOWANIE</div><div class="rules" id="rules"></div><div class="foot"><span>WYŚLIJ PREZENT, ZMIEŃ ROZGRYWKĘ</span><span>GIFTSTREAM</span></div></div></div><div class="recent" id="recent"></div><script>
const params=new URLSearchParams(location.search),template=params.get('template')||'grid';document.body.classList.add(['grid','list','minimal'].includes(template)?template:'grid');const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let giftCatalog=[];const giftPL={Rose:'Róża',Dragon:'Smok',Lion:'Lew',Donut:'Donut',Doughnut:'Donut','Ice Cream':'Lody','Finger Heart':'Serduszko z palców',Panda:'Panda'};const actionPL={spawn_zombie:'Przywołaj zombie',spawn_enemy:'Przywołaj przeciwnika',spawn_boss:'Przywołaj bossa',boss_raid:'Fala bossów',heal:'Ulecz gracza',drop_diamond:'Upuść diament',drop_item:'Upuść przedmiot',give_item:'Daj przedmiot',shield:'Tarcza',speed_boost:'Przyspieszenie',teleport:'Teleport',change_weather:'Zmień pogodę',change_time:'Zmień porę dnia',jump:'Skok'};const icons={Rose:'🌹',TikTok:'🎵','Finger Heart':'🫰',Rosa:'🌹',Doughnut:'🍩',Donut:'🍩','Ice Cream':'🍦',Panda:'🐼',Cap:'🧢',Sunglasses:'🕶️',Perfume:'🌸',Corgi:'🐶','Money Gun':'💸',Love:'💝','Hand Hearts':'🫶',Dragon:'🐉',Castle:'🏰',Lion:'🦁',Universe:'🌌'};function render(p){if(!p)return;$('#preset').textContent=`PRESET AKTYWNY · ${p.name.toLocaleUpperCase('pl-PL')}`;const rules=(p.rules||[]).filter(r=>r.enabled);$('#rules').innerHTML=rules.slice(0,12).map(r=>{const name=r.trigger.gift_name||r.trigger.keyword||r.trigger.type;const gift=giftCatalog.find(g=>(r.trigger.gift_id&&String(g.id)===String(r.trigger.gift_id))||String(g.name).toLowerCase()===String(name).toLowerCase());const art=gift?.image_url?`<img src="${esc(gift.image_url)}" alt="" style="width:100%;height:100%;object-fit:contain">`:icons[name]||'✳';const shown=name==='like'?`♡ ${Number(r.trigger.like_threshold)||100} polubień`:({gift:giftPL[name]||gift?.label_pl||name,follow:'Obserwacja',comment:'Komentarz',share:'Udostępnienie',join:'Dołączenie'})[name]||gift?.label_pl||name;return `<div class="rule"><span class="gift">${art}</span><span><b>${esc(shown)}</b><small>→ ${esc(actionPL[r.action.type]||((r.action.type||'').replaceAll('_',' ')))}</small></span></div>`}).join('')}
async function load(){try{const [r,g]=await Promise.all([fetch('/api/status'),fetch('/api/gifts')]);const d=await r.json();giftCatalog=await g.json();render(d.preset)}catch{}}function ws(){const p=location.protocol==='https:'?'wss':'ws',s=new WebSocket(`${p}://${location.host}/ws/feed`);s.onmessage=e=>{const m=JSON.parse(e.data);if(m.kind==='status'&&m.data.active_preset_id)load();if(m.kind==='event'&&m.data.type==='gift'&&m.data.gift_image_url)load();if(m.kind==='action'){const a=m.data;const el=document.createElement('div'),icon=document.createElement('i'),label=document.createElement('span');el.className='alert';icon.textContent='✳';label.textContent=`${a.params?.alert_text||a.rule_name||a.action}${a.triggered_by?.nickname?` · @${a.triggered_by.nickname}`:''}`;el.append(icon,label);$('#recent').prepend(el);setTimeout(()=>el.remove(),5100)}};s.onclose=()=>setTimeout(ws,1800)}load();ws();
</script></body></html>
