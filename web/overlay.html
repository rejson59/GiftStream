@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');:root{--lime:#c3f53c;--bg:#10110f;--text:#f3f3ee;--muted:#969b8e;--panel:#111813}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;color:var(--text);font-family:Manrope,sans-serif}.wrap{padding:12px}.card{border:1px solid #c3f53c66;background:#101511e8;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px #0005}.heading{padding:13px 14px 11px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff16}.brand{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;letter-spacing:.4px}.brand-gift{width:23px;height:23px;border-radius:6px}.brand b{color:var(--lime)}.tag{color:var(--lime);font:8px 'DM Mono',monospace;letter-spacing:1px}.tag i{display:inline-block;width:5px;height:5px;background:var(--lime);border-radius:50%;margin-right:5px;vertical-align:middle}.preset{font:8px 'DM Mono',monospace;color:var(--muted);padding:10px 14px 3px}.rules{padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:6px}.rule{min-height:55px;border:1px solid #ffffff14;background:#ffffff06;border-radius:6px;padding:7px;display:grid;grid-template-columns:27px 1fr;gap:6px;align-items:center}.gift{width:27px;height:27px;background:#c3f53c14;border-radius:5px;display:grid;place-items:center;font-size:14px}.rule b{display:block;font-size:8px;line-height:1.3}.rule small{display:block;color:var(--muted);font-size:7px;margin-top:3px}.foot{padding:8px 13px;border-top:1px solid #ffffff13;color:#858a7e;font:7px 'DM Mono',monospace;display:flex;justify-content:space-between}.recent{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:grid;gap:7px}.alert{background:#111810ee;border:1px solid var(--lime);border-radius:7px;padding:9px 14px;box-shadow:0 0 22px #c3f53c25;font-size:11px;font-weight:700;white-space:nowrap;animation:pop .25s ease-out,fade 5s forwards}.alert .streamer-wrap{display:none;position:fixed;inset:12px;pointer-events:none}.streamer-card{max-width:430px;margin:0 auto;border:1px solid #c8f36a70;border-radius:16px;background:linear-gradient(145deg,#111813f2,#0d120fee);box-shadow:0 14px 44px #0007;backdrop-filter:blur(16px);overflow:hidden}.streamer-card header{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid #ffffff16;font-size:11px;letter-spacing:.4px}.streamer-card header img{width:24px;height:24px}.streamer-live{margin-left:auto;color:#d9ff9c;font:9px 'DM Mono',monospace}.streamer-live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#c8f36a;margin-right:5px}.streamer-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px}.streamer-stat{padding:10px;border-radius:10px;background:#ffffff08;border:1px solid #ffffff12}.streamer-stat small{display:block;color:#969b8e;font:8px 'DM Mono',monospace;text-transform:uppercase}.streamer-stat b{display:block;margin-top:5px;color:#d9ff9c;font-size:16px}.streamer-activity{display:grid;gap:5px;padding:0 10px 10px}.streamer-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;background:#ffffff08;font-size:9px}.streamer-row img{width:22px;height:22px;object-fit:contain}.streamer-row small{display:block;color:#969b8e;font-size:7px;margin-top:2px}.streamer-wrap.enabled{display:block}body.streamer-mode .wrap,body.streamer-mode .recent{display:none}.overlay-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:14px 0;color:#a8b7b4;font-size:11px}.overlay-fields label{display:flex;align-items:center;gap:7px}.overlay-fields[hidden]{display:none}@media(prefers-reduced-motion:reduce){.streamer-card *{animation:none!important;transition:none!important}}</style></head><body><div class="wrap"><div class="card"><div class="heading"><span class="brand"><img class="brand-gift" src="/static/giftstream.svg" alt=""> GIFTSTREAM <b>×</b> ZASADY GRY</span><span class="tag"><i></i> NA ŻYWO</span></div><div class="preset" id="preset">AKTYWNY PRESET · ŁADOWANIE</div><div class="rules" id="rules"></div><div class="foot"><span>WYŚLIJ PREZENT, ZMIEŃ ROZGRYWKĘ</span><span>GIFTSTREAM</span></div></div></div><div class="streamer-wrap" id="streamer-wrap"><div class="streamer-card"><header><img src="/static/giftstream.svg" alt=""><strong id="streamer-name">GIFTSTREAM</strong><span class="streamer-live"><i></i> LIVE</span></header><div class="streamer-stats" id="streamer-stats"></div><div class="streamer-activity" id="streamer-activity"></div></div></div><div class="recent" id="recent"></div><script>
const params=new URLSearchParams(location.search),template=params.get('template')||'grid',selectedFields=new Set((params.get('fields')||'earnings,gifts,actions,viewers').split(',').filter(x=>['earnings','gifts','actions','viewers'].includes(x)));document.body.classList.add(['grid','list','minimal','streamer'].includes(template)?template:'grid');if(template==='streamer')document.body.classList.add('streamer-mode');const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let giftCatalog=[];const giftPL={Rose:'Róża',Dragon:'Smok',Lion:'Lew',Donut:'Donut',Doughnut:'Donut','Ice Cream':'Lody','Finger Heart':'Serduszko z palców',Panda:'Panda'};const actionPL={spawn_zombie:'Przywołaj zombie',spawn_enemy:'Przywołaj przeciwnika',spawn_boss:'Przywołaj bossa',boss_raid:'Fala bossów',heal:'Ulecz gracza',drop_diamond:'Upuść diament',drop_item:'Upuść przedmiot',give_item:'Daj przedmiot',shield:'Tarcza',speed_boost:'Przyspieszenie',teleport:'Teleport',change_weather:'Zmień pogodę',change_time:'Zmień porę dnia',jump:'Skok',parkour_level_forward:'Kolejny poziom',parkour_level_back:'Poprzedni poziom',parkour_jail:'Więzienie',parkour_reset:'Reset za 60 s',parkour_antireset:'Anty-reset'};const giftFallbackSvg='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M8 21h32v19H8zM5 15h38v9H5zM21 15h6v25h-6z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 15c-10 0-12-9-6-9 4 0 6 9 6 9Zm0 0c10 0 12-9 6-9-4 0-6 9-6 9Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>';function render(p){if(!p)return;$('#preset').textContent=`PRESET AKTYWNY · ${p.name.toLocaleUpperCase('pl-PL')}`;const rules=(p.rules||[]).filter(r=>r.enabled);$('#rules').innerHTML=rules.slice(0,12).map(r=>{const name=r.trigger.gift_name||r.trigger.keyword||r.trigger.type;const gift=giftCatalog.find(g=>(r.trigger.gift_id&&String(g.id)===String(r.trigger.gift_id))||String(g.name).toLowerCase()===String(name).toLowerCase());const art=gift?.image_url?`<img src="${esc(gift.image_url)}" alt="" style="width:100%;height:100%;object-fit:contain">`:(r.trigger.type==='gift'?giftFallbackSvg:({like:'♡',follow:'＋',comment:'⌕',share:'↗',join:'○',subscribe:'★'})[r.trigger.type]||'✳');const shown=name==='like'?`♡ ${Number(r.trigger.like_threshold)||100} polubień`:({gift:giftPL[name]||gift?.label_pl||name,follow:'Obserwacja',comment:'Komentarz',share:'Udostępnienie',join:'Dołączenie'})[name]||gift?.label_pl||name;return `<div class="rule"><span class="gift">${art}</span><span><b>${esc(shown)}</b><small>→ ${esc(actionPL[r.action.type]||((r.action.type||'').replaceAll('_',' ')))}</small></span></div>`}).join('');$('#rules').querySelectorAll('.gift img').forEach(img=>img.onerror=()=>img.parentElement.innerHTML=giftFallbackSvg)}
let streamData={events:[],actions:[],diamonds:0,gifts:0,viewers:0},streamRates={usd_per_diamond:.005,usd_to_pln:4};function renderStreamer(){if(template!=='streamer')return;$('#streamer-wrap').classList.add('enabled');const stats=[];if(selectedFields.has('earnings'))stats.push(`<div class="streamer-stat"><small>Est. zarobki · PLN</small><b>≈ ${(streamData.diamonds*streamRates.usd_per_diamond*streamRates.usd_to_pln).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})} zł</b></div>`);if(selectedFields.has('viewers'))stats.push(`<div class="streamer-stat"><small>Widzowie na żywo</small><b>${Number(streamData.viewers||0).toLocaleString('pl-PL')}</b></div>`);$('#streamer-stats').innerHTML=stats.join('');const rows=[];if(selectedFields.has('gifts'))for(const e of streamData.events.filter(e=>e.type==='gift').slice().reverse().slice(0,3)){const gift=giftCatalog.find(g=>String(g.id)===String(e.gift_id)||String(g.name).toLowerCase()===String(e.gift_name||'').toLowerCase());rows.push(`<div class="streamer-row">${gift?.image_url?`<img src="${esc(gift.image_url)}" alt="">`:'◇'}<span>${esc(e.nickname||e.user||'Widz')} · ${esc(gift?.label_pl||gift?.name||e.gift_name||'Prezent')} ×${Number(e.repeat_count)||1}<small>OSTATNI PREZENT</small></span></div>`)}if(selectedFields.has('actions'))for(const a of streamData.actions.slice().reverse().slice(0,3)){rows.push(`<div class="streamer-row">✳ <span>${esc(actionPL[a.action]||a.rule_name||a.action||'Akcja gry')}<small>AKCJA GRY</small></span></div>`)}$('#streamer-activity').innerHTML=rows.join('');if(rows.length||stats.length)$('#streamer-wrap').classList.add('enabled')}async function load(){try{const [r,g,s,rate,cfg]=await Promise.all([fetch('/api/status'),fetch('/api/gifts'),fetch('/api/snapshot'),fetch('/api/earnings/settings'),fetch('/api/config')]);const d=await r.json(),snapshot=await s.json();giftCatalog=await g.json();streamRates=await rate.json();streamData={events:snapshot.recent_events||[],actions:snapshot.recent_actions||[],diamonds:snapshot.total_diamonds||0,gifts:snapshot.total_gifts||0,viewers:snapshot.viewer_count||d.viewer_count||0};$('#streamer-name').textContent=(cfg.ok?((await cfg.json()).tiktok_username||'GIFTSTREAM'):'GIFTSTREAM').toUpperCase();render(d.preset);renderStreamer()}catch{}}function ws(){const p=location.protocol==='https:'?'wss':'ws',s=new WebSocket(`${p}://${location.host}/ws/feed`);s.onmessage=e=>{const m=JSON.parse(e.data);if(m.kind==='snapshot'){streamData={events:m.data.recent_events||[],actions:m.data.recent_actions||[],diamonds:m.data.total_diamonds||0,gifts:m.data.total_gifts||0,viewers:m.data.viewer_count||0};renderStreamer();return}if(m.kind==='status'){if(m.data.active_preset_id)load();if(m.data.parkour_reset_countdown!==undefined){const title=document.querySelector('.streamer-live');if(title)title.innerHTML=m.data.parkour_reset_countdown===null?'<i></i> LIVE':`<i></i> RESET ${Number(m.data.parkour_reset_countdown)}s`}}if(m.kind==='event'){streamData.events.push(m.data);streamData.events=streamData.events.slice(-50);if(m.data.type==='gift'&&m.data.repeat_end!==false){streamData.diamonds+=Number(m.data.diamonds)||0;streamData.gifts+=Number(m.data.repeat_count)||1}if(m.data.viewer_count)streamData.viewers=m.data.viewer_count;renderStreamer();if(m.data.type==='gift'&&m.data.gift_image_url)load();return}if(m.kind==='action'){streamData.actions.push(m.data);streamData.actions=streamData.actions.slice(-50);renderStreamer();if(template==='streamer')return;const a=m.data;const el=document.createElement('div'),icon=document.createElement('i'),label=document.createElement('span');el.className='alert';const eventGift=giftCatalog.find(g=>String(g.name).toLowerCase()===String(a.triggered_by?.gift_name||'').toLowerCase());let badge=icon;if(eventGift?.image_url){const art=document.createElement('img');art.className='alert-gift';art.src=eventGift.image_url;art.alt='';art.onerror=()=>art.replaceWith(document.createTextNode('✳'));badge=art}else icon.textContent='✳';const message=(a.params?.alert_text||a.rule_name||a.action).replace(/\p{Extended_Pictographic}/gu,'').trim();label.textContent=`${message}${a.triggered_by?.nickname?` · @${a.triggered_by.nickname}`:''}`;el.append(badge,label);$('#recent').prepend(el);setTimeout(()=>el.remove(),5100)}};s.onclose=()=>setTimeout(ws,1800)}load();ws();
</script></body></html>
