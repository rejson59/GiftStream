<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GiftStream — Zombie: przetrwanie</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#10110f;color:#f1f2ea;font-family:Manrope,sans-serif;overflow:hidden}.game{height:100vh;min-height:500px;position:relative;background:linear-gradient(180deg,#1a2524 0%,#26382c 54%,#17241d 55%,#111a14 100%);overflow:hidden}.sky{position:absolute;inset:0 0 45%;background:radial-gradient(ellipse at 75% 22%,#d8fb8844,transparent 20%),linear-gradient(180deg,#122021,#253b36 83%,#415443)}.moon{position:absolute;right:18%;top:13%;width:74px;height:74px;border-radius:50%;background:#d9f0b5;box-shadow:0 0 65px #d9f0b566}.mountain{position:absolute;bottom:42%;width:0;height:0;border-left:210px solid transparent;border-right:210px solid transparent;border-bottom:210px solid #1e3029;filter:drop-shadow(25px 20px 0 #1b2c25)}.m1{left:-50px}.m2{right:7%;border-bottom-color:#25382d;transform:scale(.7)}.ground{position:absolute;bottom:0;width:100%;height:45%;background:repeating-linear-gradient(90deg,#26392b 0 2px,transparent 2px 62px),repeating-linear-gradient(0deg,#293d2e 0 2px,transparent 2px 55px),linear-gradient(#293c2e,#151e17);border-top:3px solid #7b8b4f}.hud{position:absolute;inset:0;padding:24px;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:800;font-size:14px;letter-spacing:-.5px}.brand b{color:#c3f53c}.sub{font:9px 'DM Mono',monospace;letter-spacing:1.3px;color:#9eac9c;margin-top:5px}.stats{display:flex;gap:8px}.stat{background:#101713bb;border:1px solid #98af6633;border-radius:6px;padding:8px 11px;min-width:80px}.stat small{display:block;font:8px 'DM Mono',monospace;color:#9ca796;letter-spacing:1px}.stat strong{font-size:16px}.health{position:absolute;top:88px;left:24px;width:150px}.health span{font:8px 'DM Mono',monospace;color:#b9c0ae}.bar{height:6px;background:#242d24;border-radius:4px;margin-top:5px;overflow:hidden}.bar i{display:block;width:78%;height:100%;background:#c3f53c;transition:width .5s}.player{position:absolute;bottom:40%;left:46%;font-size:58px;filter:drop-shadow(0 8px 5px #0007);transition:left .6s,transform .2s;z-index:2}.player.hit{animation:hit .4s}.zombie{position:absolute;bottom:39%;font-size:43px;filter:drop-shadow(0 5px 5px #0009);animation:walk 7s linear forwards;z-index:1}.zombie.boss{font-size:86px;bottom:38%;filter:drop-shadow(0 0 18px #eb536a);animation:bosswalk 8s linear forwards}.diamond{position:absolute;bottom:42%;font-size:26px;animation:pop 2.4s ease-out forwards;filter:drop-shadow(0 0 12px #50d7ff)}.alert{position:absolute;top:31%;left:50%;transform:translate(-50%,-20px) scale(.8);background:#0d120feb;border:1px solid #c3f53c;border-radius:8px;padding:12px 19px;font-weight:800;font-size:16px;box-shadow:0 0 35px #c3f53c33;opacity:0;transition:.25s;text-align:center;white-space:nowrap}.alert.show{opacity:1;transform:translate(-50%,0) scale(1)}.feed{position:absolute;right:24px;bottom:24px;display:grid;gap:6px;max-width:260px}.feed-item{background:#101713cc;border:1px solid #ffffff17;border-radius:5px;padding:7px 9px;font-size:9px;animation:fade 5s forwards}.feed-item b{color:#c3f53c}.feed-item em{font-style:normal;color:#e2e5d8}.chat-prompt{position:absolute;left:24px;bottom:25px;color:#9aa398;font:9px 'DM Mono',monospace;letter-spacing:.8px}.chaos{position:absolute;inset:0;pointer-events:none}.overlay-flash{position:absolute;inset:0;background:#f43f5e55;opacity:0;animation:flash .65s}@keyframes walk{from{left:105%}to{left:-10%}}@keyframes bosswalk{from{left:110%}to{left:15%}}@keyframes pop{0%{transform:translateY(0) scale(.3);opacity:0}20%{opacity:1}75%{opacity:1}100%{transform:translateY(-180px) scale(1.2);opacity:0}}@keyframes hit{50%{transform:rotate(-15deg) translateY(10px);filter:brightness(2)}}@keyframes fade{0%{opacity:0;transform:translateY(8px)}10%,75%{opacity:1;transform:none}100%{opacity:0}}@keyframes flash{0%{opacity:1}100%{opacity:0}}.help{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#101713eb;border:1px solid #536149;border-radius:8px;padding:15px 18px;font:10px 'DM Mono',monospace;color:#d6e1c8;display:none;z-index:5;text-align:center}.help.show{display:block}.game-link{position:absolute;top:24px;left:50%;transform:translateX(-50%);pointer-events:auto;color:#b8c8a8;font:9px 'DM Mono',monospace;text-decoration:none;border-bottom:1px solid #64705e;padding-bottom:3px}@media(max-width:600px){.hud{padding:15px}.stats{gap:4px}.stat{min-width:57px;padding:6px}.stat strong{font-size:13px}.stat small{font-size:6px}.health{top:72px;left:15px}.player{font-size:44px}.feed{right:12px;bottom:45px}.chat-prompt{left:15px;bottom:15px}}
.stat{border-radius:11px;background:#101713d9;backdrop-filter:blur(12px);padding:9px 12px}.stat small{font-size:9px}.health .bar{height:8px;border-radius:99px}.health .bar i{border-radius:inherit}.alert{border-radius:13px;background:#0d120ff5;backdrop-filter:blur(14px);padding:14px 20px}.feed-item{border-radius:10px;background:#101713e8;backdrop-filter:blur(12px);padding:9px 11px;font-size:10px}.game-link{border-radius:99px;background:#101713bb;padding:8px 12px;border:1px solid #ffffff16;font-size:10px}.help{border-radius:14px;box-shadow:0 20px 65px #0009;backdrop-filter:blur(14px);line-height:1.75}@media(prefers-reduced-motion:reduce){.bar i,.player{transition:none}.zombie,.zombie.boss,.alert,.feed-item{animation-duration:.01ms!important}}
</style></head><body><div class="game"><div class="sky"><div class="moon"></div><div class="mountain m1"></div><div class="mountain m2"></div></div><div class="ground"></div><div class="hud"><div class="top"><div><div class="brand">GIFTSTREAM <b>×</b> ZOMBIE: PRZETRWANIE</div><div class="sub">GRA STEROWANA PRZEZ CZAT · DEMO</div></div><div class="stats"><div class="stat"><small>WYNIK</small><strong id="score">0000</strong></div><div class="stat"><small>FALA</small><strong id="wave">01</strong></div><div class="stat"><small>💎</small><strong id="diamonds">0</strong></div></div></div><a class="game-link" href="/" target="_blank">← WRÓĆ DO PANELU GIFTSTREAM</a><div class="health"><span>ZDROWIE GRACZA</span><div class="bar"><i id="health"></i></div></div><div class="player" id="player">🧑‍🚀</div><div class="chaos" id="chaos"></div><div id="alert" class="alert"></div><div id="feed" class="feed"></div><div class="chat-prompt">CZAT: WYSYŁAJ PREZENTY I STERUJ GRĄ</div><div id="help" class="help">DEMO GRY GIFTSTREAM<br>Prezenty skonfigurujesz w panelu.<br>Każdy prezent uruchamia akcję z aktywnego presetu.<br><br>ESC — zamknij tę planszę</div></div><script>
const $=s=>document.querySelector(s);let score=0,health=78,diamonds=0,wave=1,ws;const player=$('#player');function alertText(text){const el=$('#alert');el.textContent=text||'Akcja czatu!';el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2300)}function feed(text,user='czat'){const el=document.createElement('div'),b=document.createElement('b'),em=document.createElement('em');el.className='feed-item';b.textContent=user;em.textContent=text;el.append(b,document.createTextNode(' '),em);$('#feed').prepend(el);setTimeout(()=>el.remove(),5000)}function zombie(boss=false){const z=document.createElement('div');z.className='zombie'+(boss?' boss':'');z.textContent=boss?'👹':'🧟';$('.game').append(z);score+=boss?250:25;$('#score').textContent=String(score).padStart(4,'0');setTimeout(()=>{z.remove();if(!boss&&Math.random()<.45){health=Math.max(0,health-7);$('#health').style.width=health+'%';player.classList.add('hit');setTimeout(()=>player.classList.remove('hit'),400)}},boss?8000:7000)}function action(a){const type=a.action||a.data?.action;const p=a.params||a.data?.params||{};const event=a.triggered_by||a.data?.triggered_by;const rule=a.rule_name||a.data?.rule_name;const gift=event?.gift_name;const giftName=({Rose:'Róża',Dragon:'Smok',Lion:'Lew',Donut:'Donut',Doughnut:'Donut',Panda:'Panda'})[gift]||gift;const actionName=({spawn_zombie:'przywołuje zombie',spawn_enemy:'przywołuje przeciwnika',spawn_boss:'przywołuje bossa',boss_raid:'uruchamia falę bossów',heal:'leczy gracza',drop_diamond:'upuścił diament',drop_item:'upuścił przedmiot',give_item:'daje przedmiot',move_left:'ruch w lewo',move_right:'ruch w prawo',jump:'skok',shield:'tarcza',speed_boost:'przyspieszenie',teleport:'teleport',spawn_wall:'przeszkoda',change_weather:'zmiana pogody',change_time:'zmiana pory dnia',screen_shake:'trzęsienie ekranu',confetti:'konfetti'})[type]||type;const alert=a.params?.alert_text||a.data?.params?.alert_text||`${giftName||'Czat'} uruchamia: ${rule||actionName}`;feed(`${giftName?`wysyła ${giftName}`:`uruchamia ${actionName}`} → ${actionName}`,event?.nickname||event?.user||'widz');alertText(alert);switch(type){case'spawn_zombie':case'spawn_enemy':for(let i=0;i<Math.min(p.count||1,10);i++)setTimeout(()=>zombie(),i*230);break;case'spawn_boss':case'boss_raid':zombie(true);break;case'heal':health=Math.min(100,health+(p.amount||20));$('#health').style.width=health+'%';player.textContent='🧑‍🚀';break;case'shield':player.textContent='🛡️';setTimeout(()=>player.textContent='🧑‍🚀',(p.duration_sec||10)*1000);break;case'drop_diamond':case'drop_item':case'give_item':for(let i=0;i<(p.count||1);i++){const d=document.createElement('div');d.className='diamond';d.textContent='💎';d.style.left=(30+Math.random()*50)+'%';$('.game').append(d);diamonds++;setTimeout(()=>d.remove(),2400)}$('#diamonds').textContent=diamonds;break;case'move_left':player.style.left='25%';break;case'move_right':player.style.left='68%';break;case'jump':player.animate([{transform:'translateY(0)'},{transform:'translateY(-120px)'},{transform:'translateY(0)'}],{duration:700});break;case'speed_boost':player.animate([{filter:'drop-shadow(0 0 25px #c3f53c)'},{filter:'none'}],{duration:2500});break;case'teleport':player.style.left=(20+Math.random()*60)+'%';break;case'spawn_wall':const w=document.createElement('div');w.textContent='🧱';w.style.cssText='position:absolute;bottom:40%;left:60%;font-size:55px';$('.game').append(w);setTimeout(()=>w.remove(),7000);break;case'change_weather':case'screen_shake':$('.game').animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}],{duration:400});break;case'confetti':for(let i=0;i<20;i++){const d=document.createElement('div');d.className='diamond';d.textContent=['✨','🎉','⭐'][i%3];d.style.left=Math.random()*95+'%';$('.game').append(d);setTimeout(()=>d.remove(),2500)}break;default:if(type==='vote'){wave++;$('#wave').textContent=String(wave).padStart(2,'0')}}}function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}/ws/game`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.kind==='action')action(m.data);else if(m.kind==='event'&&m.data.type==='gift')feed(`wysyła ${m.data.gift_name}`,m.data.nickname||m.data.user)};ws.onclose=()=>setTimeout(connect,1600)}window.addEventListener('keydown',e=>{if(e.key==='Escape')$('#help').classList.toggle('show')});connect();setTimeout(()=>{for(let i=0;i<2;i++)setTimeout(()=>zombie(),i*1800)},1800);
</script></body></html>
