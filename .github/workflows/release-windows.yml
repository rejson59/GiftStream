name: Build and publish GiftStream for Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Sprawdź tag wydania
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Użyj taga w formacie vX.Y.Z, np. v0.3.0"
          }

      - name: Przygotuj Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Zainstaluj zależności, testy i PyInstaller
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pyinstaller pytest

      - name: Uruchom testy
        run: python -m pytest -q

      - name: Zbuduj aplikację desktopową
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name TipStreamApp
          --icon assets/giftstream.ico
          --paths .
          --add-data "web;web"
          --add-data "docs;docs"
          --collect-all webview
          --collect-all proxy_tools
          --collect-all bottle
          --collect-all pythonnet
          --collect-all clr_loader
          --hidden-import webview.platforms.edgechromium
          --hidden-import webview.platforms.winforms
          --hidden-import clr
          --collect-all TikTokLive
          --collect-all TikTokLiveProto
          --collect-all websockets_proxy
          --collect-all EulerApiSdk
          app/desktop.py

      - name: Zbuduj mały launcher z updaterem
        shell: pwsh
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name GiftStream
          --icon assets/giftstream.ico
          --paths .
          app/launcher.py

      - name: Przygotuj paczkę aktualizacji i SHA-256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item dist/GiftStream.exe release-assets/GiftStream.exe
          # Keep the old launcher asset name so v0.1.0 installations can update.
          Copy-Item dist/GiftStream.exe release-assets/TipStream.exe
          Compress-Archive -Path dist/TipStreamApp.exe -DestinationPath release-assets/TipStreamApp-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash release-assets/TipStreamApp-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TipStreamApp-win-x64.zip" | Set-Content -Encoding ascii release-assets/checksums.txt
          Get-ChildItem release-assets | Select-Object Name,Length

      - name: Przygotuj instalator GiftStream i WebView2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile release-assets/MicrosoftEdgeWebview2Setup.exe
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) { throw "Nie znaleziono kompilatora Inno Setup." }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $compiler "/DAppVersion=$version" "installer/GiftStream.iss"
          if ($LASTEXITCODE -ne 0) { throw "Kompilacja instalatora nie powiodła się." }
          Get-Item release-assets/GiftStream-Setup-win-x64.exe | Select-Object Name,Length

      - name: Opublikuj wydanie GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --title "GiftStream $tag" `
            --generate-notes `
            release-assets/GiftStream-Setup-win-x64.exe `
            release-assets/GiftStream.exe `
            release-assets/TipStream.exe `
            release-assets/TipStreamApp-win-x64.zip `
            release-assets/checksums.txt
